name: Sign and publish Nextcloud release

on:
  push:
    branches:
      - release

permissions:
  contents: read

concurrency:
  group: signed-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release metadata and scripts
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check version, changelog, and release files
        id: metadata
        run: |
          python3 -m unittest discover -s tests/release
          version=$(python3 scripts/release_metadata.py)
          if git show-ref --verify --quiet "refs/tags/v$version"; then
            echo "::error::Tag v$version already exists. Bump the app version and changelog before releasing."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    name: Run Nextcloud VM tests
    needs: validate
    uses: ./.github/workflows/vm-test.yml

  sign:
    name: Sign and verify release archive
    needs: [validate, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-signing
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: sh scripts/ci-sign-app.sh
        env:
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          APP_PUBLIC_CRT: ${{ secrets.APP_PUBLIC_CRT }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-release-${{ github.sha }}
          path: |
            build/qownnotesapi-nc.tar.gz
            build/qownnotesapi-nc.tar.gz.sig
            build/qownnotesapi-nc.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  github:
    name: Publish GitHub release
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-publishing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-release-${{ github.sha }}
          path: build
      - run: python3 scripts/publish-release.py github --commit "$GITHUB_SHA"
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}

  appstore:
    name: Publish Nextcloud App Store release
    needs: [validate, github]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-publishing
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-release-${{ github.sha }}
          path: build
      - run: python3 scripts/publish-release.py appstore --version "$RELEASE_VERSION"
        env:
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
