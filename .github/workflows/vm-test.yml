name: "🧪 Run VM test"

on:
  push:
    branches-ignore:
      - release
    paths-ignore:
      - docker/**
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths-ignore:
      - docker/**

jobs:
  check:
    name: "🧪 Run VM test"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: "📦 Install Nix"
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: "🧪 Run Nextcloud App VM tests"
        run: nix build -L .#nixosTests.nextcloud-qownnotesapi
